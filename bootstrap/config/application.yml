# Настройки локального запуска. В поставку не входят: ни в jar, ни в образ этот файл не попадает.
#
# Почему он лежит здесь, а не в корне репозитория: Spring Boot по умолчанию читает
# ./config/application.yml из РАБОЧЕГО КАТАЛОГА поверх конфигурации из classpath, а рабочий
# каталог локального запуска — это каталог модуля bootstrap. Так его видят одинаково и
# `./gradlew :bootstrap:bootRun` (JavaExec), и Spring Boot run configuration в IDE, которая
# стартует main-класс напрямую, минуя Gradle.
#
# Что он делает: подставляет ключ шифрования контента (DB-04). Требование «нет ключа — нет
# старта» существует для развёртывания и остаётся в силе: этого файла нет ни в jar'е
# (bootstrap/config — не каталог ресурсов), ни в образе (Dockerfile копирует только bootstrap/src),
# поэтому `java -jar` и контейнер без настоящего ключа по-прежнему не стартуют. Локально же отказ
# старта не сообщал разработчику ничего о том, чем он занят, и стоил одного экспорта на терминал.
#
# Ключ секретом не является: это base64 строки "commhub-local-development-key!!!", и он защищает
# одноразовую базу из docker compose. В контуре Банка ключ приходит из секрет-хранилища платформы.
# Экспортированный CONTENT_ENCRYPTION_KEY побеждает — placeholder ниже читает его первым.
commhub:
  persistence:
    encryption:
      keys:
        k1: ${CONTENT_ENCRYPTION_KEY:Y29tbWh1Yi1sb2NhbC1kZXZlbG9wbWVudC1rZXkhISE=}
