# Настройки локального запуска для случая, когда рабочий каталог — каталог модуля bootstrap
# (так работает `./gradlew :bootstrap:bootRun`). Своего значения здесь нет: ключ задан один раз
# в config/application.yml в корне репозитория, а этот файл его импортирует, чтобы запуск работал
# при обоих соглашениях о рабочем каталоге. Почему их два — в комментарии корневого файла.
#
# optional: путь относителен рабочему каталогу, и если файла там не окажется, Spring Boot просто
# пройдёт мимо, а не откажет в старте.
spring:
  config:
    import: optional:file:../config/application.yml
