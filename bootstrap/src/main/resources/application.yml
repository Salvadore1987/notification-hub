spring:
  application:
    name: notification-hub

  # AR-07: массовый I/O к провайдерам — на виртуальных потоках (Java 25 Loom).
  threads:
    virtual:
      enabled: true

  datasource:
    # currentSchema: адаптеры пишут SQL без префикса схемы, весь Hub живёт в comm_hub.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commhub?currentSchema=comm_hub}
    username: ${DB_USER:commhub}
    password: ${DB_PASSWORD:commhub}
    hikari:
      pool-name: commhub-pool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}

  # DB-01: схема воспроизводима с нуля только через миграции.
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: comm_hub
    default-schema: comm_hub
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  # NF-05: graceful shutdown с дообработкой in-flight
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # NF-05 (продолжение): при остановке планировщик дожидается текущего прохода. Это важно именно
  # для relay'я outbox — пройденная половина пачки без отметки published означала бы повторную
  # публикацию, а прерванная запись курсора выгрузки — повторную страницу в витрине (AD-03, FR-6.4).
  task:
    scheduling:
      # Предел задан явно, а не унаследован: с виртуальными потоками Boot берёт
      # SimpleAsyncTaskScheduler, без них пул по умолчанию равен одному — и девять @Scheduled
      # выстраиваются за самым медленным. Выглядит это как «Модуль перестал отправлять»
      # и к отправке отношения не имеет (ADR-0039).
      simple:
        concurrency-limit: ${SCHEDULER_CONCURRENCY:16}
      shutdown:
        await-termination: true
        await-termination-period: 20s

  # SEC-02: издатель OIDC ОБЯЗАТЕЛЕН и задаётся окружением — здесь его нет намеренно, чтобы значения
  # по умолчанию не существовало: админ-панель за OIDC на любом контуре (ADR-0037), и инстанс без
  # издателя не стартует, а не открывает панель.
  #   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://sso.hamkorbank.uz/realms/commhub
  # Локальный запуск берёт его из config/application.yml (Keycloak из docker compose, demo/demo).

commhub:
  # Kafka (§8.1). Namespace свой, а не spring.kafka: в Spring Boot 4 автоконфигурация Kafka вынесена
  # в отдельный модуль, который здесь не подключён — продюсер собирается явно (KafkaProducerConfig),
  # чтобы гарантии AD-03 (acks=all, идемпотентность) жили в коде, а не в перенастраиваемом yaml.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${KAFKA_CLIENT_ID:notification-hub}
    # SEC-01, брокерская половина: SASL/SCRAM или mTLS плюс ACL на топики. Пароль — ссылка на секрет
    # (SEC-04), не литерал в ConfigMap (NF-06). Читается один раз на старте: клиент Kafka собирает
    # JAAS при создании, поэтому ротация брокерского пароля стоит rolling restart'а, а не рестарта.
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:}
      mechanism: ${KAFKA_SASL_MECHANISM:}
      username: ${KAFKA_SASL_USERNAME:}
      password: ${KAFKA_SASL_PASSWORD:}
      truststore-location: ${KAFKA_TRUSTSTORE_LOCATION:}
      truststore-password: ${KAFKA_TRUSTSTORE_PASSWORD:}
      keystore-location: ${KAFKA_KEYSTORE_LOCATION:}
      keystore-password: ${KAFKA_KEYSTORE_PASSWORD:}
    outbound:
      status-topic: ${KAFKA_STATUS_TOPIC:comm.outbound.status.v1}
      dlq-topic: ${KAFKA_DLQ_TOPIC:comm.outbound.dlq.v1}
      # PU-04: токены, признанные платформой мёртвыми. Свой топик, а не статус с особой причиной:
      # его потребитель — владелец реестра устройств, и retention у него свой.
      push-token-topic: ${KAFKA_PUSH_TOKEN_TOPIC:comm.outbound.push-token.invalidated.v1}
      # FR-6.4: завершённые отправки для витрины данных. Отдельный топик, а не фильтр по статусам:
      # его читает batch-job, и retention у него месяцы, а не дни.
      analytics-topic: ${KAFKA_ANALYTICS_TOPIC:comm.outbound.events.v1}
      # Сколько relay ждёт подтверждения брокера; на это время строки outbox остаются заблокированными.
      send-timeout: ${KAFKA_SEND_TIMEOUT:10s}
      # В контуре Банка топики заводит эксплуатация (партиции, retention, ACL) — здесь false.
      create-topics: ${KAFKA_CREATE_TOPICS:false}
      partitions: ${KAFKA_OUTBOUND_PARTITIONS:12}
      replication-factor: ${KAFKA_OUTBOUND_REPLICATION_FACTOR:1}

    # Входящие топики (§8.1 IK-01). Класс трафика определяется топиком, а не полем в документе:
    # изоляция OTP (TC-01) построена на топиках, и payload не должен уметь себя переклассифицировать.
    inbound:
      enabled: ${KAFKA_INBOUND_ENABLED:true}
      # Суффикс класса добавляется к group-id: группы (а значит и лаг) у классов раздельные.
      group-id: ${KAFKA_INBOUND_GROUP_ID:notification-hub}
      topics:
        critical: ${KAFKA_TOPIC_CRITICAL:comm.inbound.critical.v1}
        transactional: ${KAFKA_TOPIC_TRANSACTIONAL:comm.inbound.transactional.v1}
        notification: ${KAFKA_TOPIC_NOTIFICATION:comm.inbound.notification.v1}
        batch-control: ${KAFKA_TOPIC_BATCH_CONTROL:comm.inbound.batch-control.v1}
        parse-error: ${KAFKA_TOPIC_PARSE_ERROR:comm.inbound.parse-error.v1}
      # Раздельные пулы потоков на класс (TC-01): массовая рассылка не занимает потоки OTP.
      # Значение не имеет смысла поднимать выше числа партиций топика.
      concurrency:
        critical: ${KAFKA_CONCURRENCY_CRITICAL:2}
        transactional: ${KAFKA_CONCURRENCY_TRANSACTIONAL:4}
        notification: ${KAFKA_CONCURRENCY_NOTIFICATION:8}
        batch-control: ${KAFKA_CONCURRENCY_BATCH_CONTROL:1}
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:100}
      poll-timeout: ${KAFKA_POLL_TIMEOUT:5s}

  # Transactional Outbox → Kafka (AD-03). Relay работает на каждом инстансе: строки берутся
  # FOR UPDATE SKIP LOCKED, поэтому инстансы делят очередь, а не дублируют её.
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      poll-interval-ms: ${OUTBOX_RELAY_POLL_INTERVAL_MS:500}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:200}
      max-passes-per-tick: ${OUTBOX_RELAY_MAX_PASSES:10}

  # AD-04/TC-01: диспетчер отправки (ADR-0039). Свой планировщик на класс трафика — массовая
  # рассылка не имеет права занять обороты, отведённые OTP. Строки берутся FOR UPDATE SKIP LOCKED
  # и помечаются арендой, поэтому инстансы делят очередь, а не дублируют её.
  #
  # concurrency выше размера пула соединений намеренно: вызов провайдера идёт вне транзакции
  # (сага разрезана надвое), соединение занято только на подготовке и расчёте оборота.
  dispatch:
    enabled: ${COMMHUB_DISPATCH_ENABLED:true}
    # Аренда переживает оборот: покрывает самый медленный вызов провайдера и обе транзакции.
    lease: ${COMMHUB_DISPATCH_LEASE:2m}
    owner: ${HOSTNAME:}
    critical-otp:
      poll-interval: ${COMMHUB_DISPATCH_OTP_INTERVAL:200ms}
      batch-size: ${COMMHUB_DISPATCH_OTP_BATCH:100}
      max-passes-per-tick: 5
      concurrency: ${COMMHUB_DISPATCH_OTP_CONCURRENCY:32}
    transactional:
      poll-interval: ${COMMHUB_DISPATCH_TX_INTERVAL:500ms}
      batch-size: ${COMMHUB_DISPATCH_TX_BATCH:200}
      max-passes-per-tick: 10
      concurrency: ${COMMHUB_DISPATCH_TX_CONCURRENCY:32}
    notification:
      poll-interval: ${COMMHUB_DISPATCH_BULK_INTERVAL:1s}
      batch-size: ${COMMHUB_DISPATCH_BULK_BATCH:500}
      max-passes-per-tick: 20
      concurrency: ${COMMHUB_DISPATCH_BULK_CONCURRENCY:64}
    # FR-3.4: сообщения, чей TTL истёк, пока они ждали. Сага проверяет TTL на каждом обороте,
    # свип ловит лишь то, до чего оборот не дошёл, — поэтому редко.
    expiry:
      enabled: ${COMMHUB_EXPIRY_ENABLED:true}
      interval: ${COMMHUB_EXPIRY_INTERVAL:30s}
      limit: ${COMMHUB_EXPIRY_LIMIT:500}
      max-passes-per-tick: 10

  # SEC-01/SEC-03. Здесь НЕТ переключателя аутентификации админ-панели: она за OIDC всегда
  # (ADR-0037), издатель обязателен, инстанс без него не стартует. Ниже — только то, что вправе
  # решать контур: обязан ли токен системам-источникам и как называются claim'ы.
  security:
    # SEC-01: требовать ли токен на /api/v1. Панели это не касается — она закрыта в любом случае.
    # Локально выключено: разработчику, отправляющему тестовое сообщение, иначе нужен
    # client-credentials токен, чтобы увидеть уход одной SMS.
    require-source-system-token: ${COMMHUB_REQUIRE_SOURCE_SYSTEM_TOKEN:false}
    # Claim со списком потоков, за которые клиент вправе слать и которые вправе читать (SEC-01).
    stream-claim: ${COMMHUB_STREAM_CLAIM:commhub_streams}
    # Claim с группами SSO; маппится на роли app_role из §10.1 (FR-7.2). Имя группы = имя роли:
    # значение claim'а идёт как есть, в верхнем регистре (см. docker/keycloak/commhub-realm.json).
    roles-claim: ${COMMHUB_ROLES_CLAIM:groups}
    scope-claim: ${COMMHUB_SCOPE_CLAIM:scope}
    # true — штатное развёртывание, где management-порт доступен только из namespace мониторинга.
    anonymous-metrics: ${COMMHUB_ANONYMOUS_METRICS:true}
    management-base-path: ${management.endpoints.web.base-path:/actuator}

  # OBS-01: как часто пересчитываются метрики-состояния (глубина outbox, возраст старейшего
  # неопубликованного события, глубина DLQ). Скрейп читает готовое значение и не ходит в БД.
  metrics:
    backlog-refresh-interval: ${COMMHUB_METRICS_BACKLOG_INTERVAL:15s}

  # FR-6.4: выгрузка завершённых отправок в витрину данных. Выключена по умолчанию — топик и его
  # схема согласуются с командой данных до первой публикации.
  export:
    events:
      enabled: ${COMMHUB_EVENT_EXPORT_ENABLED:false}
      interval: ${COMMHUB_EVENT_EXPORT_INTERVAL:1m}
      page-size: ${COMMHUB_EVENT_EXPORT_PAGE_SIZE:500}
      max-pages: ${COMMHUB_EVENT_EXPORT_MAX_PAGES:20}

  # Синхронный API систем-источников (§8.2).
  rest:
    # IR-02: лимит скорости на поток, ответ 429 + Retry-After. Считаются запросы, а не сообщения:
    # чанк батча — это один запрос, его размер ограничен отдельно (10 000 элементов).
    # Лимит на инстанс: общий предел кластера делится на число реплик за балансировщиком.
    rate-limit:
      enabled: ${REST_RATE_LIMIT_ENABLED:true}
      default-permits-per-second: ${REST_RATE_LIMIT_RPS:200}
      default-burst: ${REST_RATE_LIMIT_BURST:400}
      # С Phase 8 пер-стримовый лимит живёт в реестре потоков (stream.rate_limit_config) и
      # правится из админ-панели без рестарта (AD-07); значения ниже — запасной вариант для
      # потоков, у которых собственного лимита ещё нет. Пример:
      # streams:
      #   ibank-retail:
      #     permits-per-second: 500
      #     burst: 1000
      #
      # Ключа streams здесь нет намеренно: пустая карта в YAML (`streams: {}`) приходит в биндер
      # скаляром, и Map её не принимает — контекст не поднимается вовсе. Отсутствующий ключ даёт
      # ровно то же значение (компактный конструктор записи подставляет пустую карту).
      # Как долго переиспользуется лимит, прочитанный из реестра: лимитер работает на каждом
      # принятом запросе, поэтому поход в БД на запрос недопустим (NF-07 ограничивает 30с).
      registry-cache-ttl: ${REST_RATE_LIMIT_REGISTRY_TTL:10s}

  # FR-1.5: окно идемпотентности приёма. Это же окно держит размер dedup_registry (DB-03):
  # расширение окна расширяет таблицу, в которую пишется каждое принятое сообщение.
  dedup:
    window: ${DEDUP_WINDOW:24h}

  # PR-01, FR-2.2, FR-3.3: внешний бюджет саги отправки — сколько попыток у сообщения всего и
  # сколько из них на одном провайдере до перехода на резервного. Внутренний ретрай одного вызова
  # живёт в commhub.provider.<code>.resilience и измеряется сотнями миллисекунд.
  sending:
    max-attempts-per-provider: ${SENDING_ATTEMPTS_PER_PROVIDER:2}
    max-total-attempts: ${SENDING_MAX_ATTEMPTS:5}
    initial-backoff: ${SENDING_INITIAL_BACKOFF:2s}
    backoff-multiplier: ${SENDING_BACKOFF_MULTIPLIER:2.0}
    max-backoff: ${SENDING_MAX_BACKOFF:30s}

  # Конфигурация маршрутизации в БД (AD-07, NF-07). Снапшот каналов/провайдеров/политик держится
  # в памяти и перечитывается по расписанию: маршрутизируется каждое сообщение, а конфигурация
  # меняется несколько раз в месяц. Изменение с этого инстанса видно сразу (снапшот сбрасывается),
  # с соседних — в пределах refresh-interval. Потолок 30с — это NF-07, он проверяется на старте.
  config:
    cache:
      enabled: ${CONFIG_CACHE_ENABLED:true}
      refresh-interval: ${CONFIG_CACHE_REFRESH_INTERVAL:10s}

  # FR-4.6: разовый импорт существующей базы шаблонов Банка (~470 шаблонов) из CSV.
  # Выключено по умолчанию: это шаг внедрения (запускается отдельным job'ом с примонтированным
  # файлом), а не то, что должен повторять рестарт пода. Повтор безопасен — уже опубликованная
  # формулировка пропускается, — но это страховка, а не план. Формат файла — в
  # adapter/in/importer/package-info.java. approver публикует импортированные версии и обязан
  # отличаться от author (maker/checker, FR-4.2); без него всё ложится черновиками.
  import:
    templates:
      enabled: ${TEMPLATE_IMPORT_ENABLED:false}
      file: ${TEMPLATE_IMPORT_FILE:}
      delimiter: ${TEMPLATE_IMPORT_DELIMITER:;}
      author: ${TEMPLATE_IMPORT_AUTHOR:legacy-import}
      approver: ${TEMPLATE_IMPORT_APPROVER:}

  # Провайдерские callback'и статусов (PM-02, SEC-07). Ключи — коды провайдеров.
  # Секрет приходит значением из переменной окружения (SG-04, ADR-0044) и в логах не появляется.
  callback:
    base: ${CALLBACK_BASE_PATH:/api/callbacks}
    providers:
      PLAYMOBILE:
        enabled: ${PLAYMOBILE_CALLBACK_ENABLED:true}
        # Пусто = проверка адреса делегирована сети; список согласуется с Playmobile (PM-02).
        allowed-ips: ${PLAYMOBILE_CALLBACK_IPS:}
        secret-header: ${PLAYMOBILE_CALLBACK_HEADER:X-Commhub-Callback-Secret}
        # Пусто = проверка секрета выключена. Это осознанное решение эксплуатации, а не умолчание.
        secret: ${PLAYMOBILE_CALLBACK_SECRET:}
      SMSGATE:
        enabled: ${SMSGATE_CALLBACK_ENABLED:true}
        allowed-ips: ${SMSGATE_CALLBACK_IPS:}
        secret-header: ${SMSGATE_CALLBACK_HEADER:X-Commhub-Callback-Secret}
        secret: ${SMSGATE_CALLBACK_SECRET:}

  # Адаптеры провайдеров (§9, PR-01). Значения ниже — умолчания деплоя: лимиты берутся из
  # provider.rate_limit_config, а настройки отправки (originator/sender, приоритеты, веса, TTL) —
  # из provider.endpoint_config, и применяются без рестарта (FR-2.5, AD-07). Не переезжают:
  # креды (значения переменных окружения, SEC-04, ADR-0044) и параметры HTTP-клиента (base-url,
  # таймауты, окна breaker'а) — это топология деплоя, её смена и есть деплой.
  provider:
    # FR-6.3/PR-02: пассивный монитор здоровья провайдеров. Считает долю ошибок и таймаутов по
    # delivery_attempt за окно, ставит DOWN (→ автоматический failover) и возвращает обратно.
    health:
      enabled: ${PROVIDER_HEALTH_ENABLED:true}
      interval: ${PROVIDER_HEALTH_INTERVAL:30s}
      initial-delay: ${PROVIDER_HEALTH_INITIAL_DELAY:60s}
      # Пороги оценки. DOWN снимает провайдера с выбора, поэтому failover не требует отдельного кода
      # (FR-2.2). recovery-after — испытательный срок: провайдер без трафика никогда не наберёт
      # статистику, которая его оправдает, поэтому после этого молчания он возвращается в UNKNOWN.
      window: ${PROVIDER_HEALTH_WINDOW:5m}
      minimum-attempts: ${PROVIDER_HEALTH_MIN_ATTEMPTS:20}
      degraded-error-rate: ${PROVIDER_HEALTH_DEGRADED_RATE:0.2}
      down-error-rate: ${PROVIDER_HEALTH_DOWN_RATE:0.5}
      down-timeout-rate: ${PROVIDER_HEALTH_TIMEOUT_RATE:0.3}
      recovery-after: ${PROVIDER_HEALTH_RECOVERY_AFTER:2m}

    # Playmobile SMS-Broker — основной провайдер SMS (§9.1, §18.1).
    playmobile:
      enabled: ${PLAYMOBILE_ENABLED:true}
      provider-code: ${PLAYMOBILE_PROVIDER_CODE:PLAYMOBILE}
      # Значения, а не ссылки: платформа кладёт их в окружение пода (SEC-04, ADR-0044). Пусто =
      # провайдер не настроен, и отправка отклоняется как NO_CREDENTIALS, а не уходит без учётных данных.
      credentials:
        username: ${PLAYMOBILE_USERNAME:}
        password: ${PLAYMOBILE_PASSWORD:}
      sending:
        originator: ${PLAYMOBILE_ORIGINATOR:}
        # Префикс message-id, согласован с Playmobile; вместе с номером — не более 20 символов (§9.1).
        organisation-prefix: ${PLAYMOBILE_MESSAGE_ID_PREFIX:HB}
        # default-ttl: 1h   # sms.ttl для сообщений без собственного TTL; без ключа поле не отправляется
        # PM-03: класс трафика задаёт нижнюю границу приоритета, сообщение может её только поднять.
        priorities:
          critical-otp: realtime
          transactional: normal
          notification: low
      http:
        base-url: ${PLAYMOBILE_BASE_URL:http://localhost:8089/broker-api}
        connect-timeout: ${PLAYMOBILE_CONNECT_TIMEOUT:3s}
        read-timeout: ${PLAYMOBILE_READ_TIMEOUT:10s}
      resilience:
        # Ретрай внутри попытки допустим: message-id генерирует Hub, повтор дедуплицируется провайдером.
        max-attempts: ${PLAYMOBILE_RETRY_ATTEMPTS:2}
        open-duration: ${PLAYMOBILE_CB_OPEN:30s}

    # SMS Gate v4.3 — резервный провайдер SMS (§9.2, §18.2).
    smsgate:
      enabled: ${SMSGATE_ENABLED:true}
      provider-code: ${SMSGATE_PROVIDER_CODE:SMSGATE}
      credentials:
        login: ${SMSGATE_LOGIN:}
        key: ${SMSGATE_KEY:}
      sending:
        sender: ${SMSGATE_SENDER:}
        # weight 0–10, больше — раньше в очереди провайдера (§9.2).
        weights:
          critical-otp: 10
          transactional: 7
          notification: 3
      # §18.2: антиспам-лимит провайдера 50 SMS/час/номер. Счётчик локальный на инстанс,
      # поэтому целимся ниже линии, а не в неё (FR-2.5).
      rate-limit:
        per-recipient-per-hour: ${SMSGATE_RECIPIENT_PER_HOUR:45}
      # SG-03: опрос /api/v2/search по сообщениям без DLR. Выключено по умолчанию —
      # включается там, где FEEDBACK доказанно теряется.
      reconciliation:
        enabled: ${SMSGATE_RECONCILIATION_ENABLED:false}
        after: ${SMSGATE_RECONCILIATION_AFTER:15m}
        batch-size: ${SMSGATE_RECONCILIATION_BATCH:100}
        interval: ${SMSGATE_RECONCILIATION_INTERVAL:5m}
      http:
        base-url: ${SMSGATE_BASE_URL:http://localhost:8089}
        connect-timeout: ${SMSGATE_CONNECT_TIMEOUT:3s}
        read-timeout: ${SMSGATE_READ_TIMEOUT:10s}
      resilience:
        # 1 = без ретрая внутри попытки: /api/v2/send не принимает клиентский id,
        # повтор после потерянного ответа — это второе SMS клиенту (§9.2).
        max-attempts: ${SMSGATE_RETRY_ATTEMPTS:1}
        open-duration: ${SMSGATE_CB_OPEN:30s}

    # Firebase Cloud Messaging — канал Push, Android (и iOS в режиме PU-05) (§9.4.1).
    # project-id здесь нет намеренно: он лежит в ключе сервис-аккаунта, и деплой, способный назвать
    # в yaml один проект, а в ключе другой, упадёт на первой отправке с ошибкой, не называющей ни один.
    fcm:
      enabled: ${FCM_ENABLED:false}
      provider-code: ${FCM_PROVIDER_CODE:FCM}
      # JSON-ключ сервис-аккаунта целиком, значением из окружения (SEC-04). В образ и в yaml не
      # кладётся никогда: это единственный секрет, дающий право писать клиентам Банка в push.
      # Принимается и как есть, и в base64 — многострочный JSON удобнее одной строкой (ADR-0044).
      credentials:
        service-account: ${FCM_SERVICE_ACCOUNT:}
      sending:
        # PU-03: HIGH будит устройство. Массовая рассылка на HIGH — это разряженные батареи и
        # последующий троттлинг со стороны Google для всего трафика, включая OTP.
        priorities:
          critical-otp: HIGH
          transactional: HIGH
          notification: NORMAL
        default-ttl: ${FCM_DEFAULT_TTL:1h}
        # PU-05: FCM как единый провайдер для обеих платформ (приложение Банка на Firebase SDK).
        # Выключено: это факт об iOS-приложении, а не предпочтение (открытый вопрос 12 §17).
        # Правится и из provider.endpoint_config (ключ ios-delivery) — без рестарта (AD-07).
        ios-delivery: ${FCM_IOS_DELIVERY:false}
        # PU-13: тестовая отправка уходит как validate_only — токен проверяется, уведомление
        # на телефоне клиента не появляется.
        validate-test-sends: ${FCM_VALIDATE_TEST_SENDS:true}
      oauth:
        token-url: ${FCM_TOKEN_URL:https://oauth2.googleapis.com/token}
        # Насколько раньше истечения обновляется access token (PU-01): токен, истёкший в полёте,
        # стоит сообщению его SLA, а живёт он час — запас дешёвый.
        refresh-skew: ${FCM_TOKEN_REFRESH_SKEW:5m}
      http:
        base-url: ${FCM_BASE_URL:https://fcm.googleapis.com}
        connect-timeout: ${FCM_CONNECT_TIMEOUT:3s}
        read-timeout: ${FCM_READ_TIMEOUT:10s}
      resilience:
        # Ретрай внутри попытки допустим: ретраятся только вызовы без ответа (PR-01), а транзиентные
        # коды FCM прямо говорят, что сообщение не принято, — дубля уведомления не будет.
        max-attempts: ${FCM_RETRY_ATTEMPTS:2}
        open-duration: ${FCM_CB_OPEN:30s}

    # Apple Push Notification service — канал Push, iOS напрямую (§9.4.2).
    apns:
      enabled: ${APNS_ENABLED:false}
      provider-code: ${APNS_PROVIDER_CODE:APNS}
      credentials:
        team-id: ${APNS_TEAM_ID:}
        key-id: ${APNS_KEY_ID:}
        # .p8-ключ (PKCS#8) значением из окружения (SEC-04); в отличие от сертификата, не истекает.
        # Принимается и как есть, и в base64 — PEM многострочный (ADR-0044).
        private-key: ${APNS_PRIVATE_KEY:}
        # PU-06: подпись обновляется не чаще раза в 20 минут и не реже раза в час.
        # Значение вне этого окна не роняет старт, а приводится к границе: цена отказа —
        # выключенный канал push, а правильный диапазон известен из спецификации.
        refresh-interval: ${APNS_JWT_REFRESH:40m}
      sending:
        # bundle id приложения Банка; без него не доставляется ничего (apns-topic).
        # Правится из provider.endpoint_config (ключ topic) без рестарта (AD-07).
        topic: ${APNS_TOPIC:}
        push-type: ${APNS_PUSH_TYPE:alert}
        default-ttl: ${APNS_DEFAULT_TTL:1h}
      http:
        base-url: ${APNS_BASE_URL:https://api.push.apple.com}
        connect-timeout: ${APNS_CONNECT_TIMEOUT:3s}
        read-timeout: ${APNS_READ_TIMEOUT:10s}
      # PU-13: токен из dev/TestFlight-сборки существует только в sandbox, и выбор делается
      # на сообщение по признаку TEST (FR-7.4), а не на деплой.
      sandbox:
        base-url: ${APNS_SANDBOX_BASE_URL:https://api.sandbox.push.apple.com}
        connect-timeout: ${APNS_CONNECT_TIMEOUT:3s}
        read-timeout: ${APNS_READ_TIMEOUT:10s}
      resilience:
        # 1 = без ретрая внутри попытки: apns-id делает повтор идемпотентным, но потерянное
        # соединение — ровно тот случай, когда неизвестно, поставила ли Apple уведомление в очередь.
        max-attempts: ${APNS_RETRY_ATTEMPTS:1}
        open-duration: ${APNS_CB_OPEN:30s}

    # Корпоративный SMTP — канал Email (§9.3, EM-01…EM-03).
    # Не переезжает в provider.endpoint_config (в отличие от from/from-name/reply-to): host, port,
    # TLS, таймауты, размер пула и return-path. Первые — топология деплоя, а return-path обязан
    # совпадать с ящиком, который читает поллер bounce'ов: сменить одно без другого — молча
    # выключить обработку hard bounce (EM-02).
    smtp:
      enabled: ${SMTP_ENABLED:false}
      provider-code: ${SMTP_PROVIDER_CODE:SMTP}
      server:
        host: ${SMTP_HOST:localhost}
        port: ${SMTP_PORT:}
        # NONE | STARTTLS | TLS. STARTTLS требуется, а не «по возможности»: молчаливый откат в
        # открытый канал — это письмо клиента, ушедшее по сети в открытом виде (SEC-06).
        security: ${SMTP_SECURITY:STARTTLS}
        ehlo-name: ${SMTP_EHLO_NAME:}
        credentials:
          # Пусто = релей без аутентификации; внутри сети Банка это нормальная конфигурация.
          username: ${SMTP_USERNAME:}
          password: ${SMTP_PASSWORD:}
        connect-timeout: ${SMTP_CONNECT_TIMEOUT:5s}
        read-timeout: ${SMTP_READ_TIMEOUT:15s}
        # Бюджет на выталкивание письма — тот, который решает при вложениях (EM-01).
        write-timeout: ${SMTP_WRITE_TIMEOUT:30s}
      sending:
        from: ${SMTP_FROM:no-reply@hamkorbank.uz}
        from-name: ${SMTP_FROM_NAME:Hamkorbank}
        reply-to: ${SMTP_REPLY_TO:}
        # Конверт (MAIL FROM): сюда релей пришлёт отчёт о недоставке, отсюда его читает поллер.
        return-path: ${SMTP_RETURN_PATH:}
      pool:
        # Одновременно открытых соединений; это же — предел параллелизма канала (EM-01).
        max-connections: ${SMTP_POOL_SIZE:8}
        max-messages-per-connection: ${SMTP_POOL_MESSAGES:100}
        idle-timeout: ${SMTP_POOL_IDLE:1m}
        acquire-timeout: ${SMTP_POOL_ACQUIRE:10s}
      # EM-01: лимит скорости релея. С Phase 8 значение из provider.rate_limit_config побеждает.
      rate-limit:
        tps: ${SMTP_TPS:20}
        per-minute: ${SMTP_PER_MINUTE:0}
      # EM-03: подпись писем. Выключена — обычно подписывает сам корпоративный релей; включается
      # там, где он этого не делает. Ключ — PKCS#8 из окружения; инлайн в yaml его класть нельзя.
      dkim:
        enabled: ${SMTP_DKIM_ENABLED:false}
        domain: ${SMTP_DKIM_DOMAIN:}
        selector: ${SMTP_DKIM_SELECTOR:}
        # PEM или тот же PEM в base64 — многострочный ключ проще везти одной строкой (ADR-0044).
        private-key: ${SMTP_DKIM_KEY:}
      # EM-02: разбор NDR из выделенного ящика (IMAP). Выключено: ящик заводит почтовая команда
      # Банка, и поллер, каждую минуту падающий на несуществующем ящике, — плохой способ об этом
      # узнать. Отчёт применяется через тот же ProcessProviderStatus, что и DLR провайдеров (AD-06).
      bounce:
        enabled: ${SMTP_BOUNCE_ENABLED:false}
        host: ${SMTP_BOUNCE_HOST:}
        port: ${SMTP_BOUNCE_PORT:}
        ssl: ${SMTP_BOUNCE_SSL:true}
        credentials:
          username: ${SMTP_BOUNCE_USERNAME:}
          password: ${SMTP_BOUNCE_PASSWORD:}
        folder: ${SMTP_BOUNCE_FOLDER:INBOX}
        batch-size: ${SMTP_BOUNCE_BATCH:200}
        settings:
          interval: ${SMTP_BOUNCE_INTERVAL:5m}
          connect-timeout: ${SMTP_BOUNCE_CONNECT_TIMEOUT:5s}
          read-timeout: ${SMTP_BOUNCE_READ_TIMEOUT:30s}
          # false = помечать прочитанным, а не удалять: отчёт, который Hub не смог сопоставить
          # с сообщением, — это улика, и удалить её молча нельзя.
          delete-processed: ${SMTP_BOUNCE_DELETE:false}

  # Хранилище: секции и retention (DB-02, DB-03), реплика для аналитики (DB-06).
  persistence:
    partitions-ahead: ${DB_PARTITIONS_AHEAD:2}
    retention-months: ${DB_RETENTION_MONTHS:12}
    # Отцепление секций включается вместе с процедурой архивации — иначе данные уйдут в никуда.
    detach-old-partitions: ${DB_DETACH_OLD_PARTITIONS:false}
    maintenance-cron: ${DB_MAINTENANCE_CRON:0 30 2 * * *}
    # Свип таблиц окна (dedup-реестр FR-1.5, счётчики частоты FR-5.4): они не секционированы,
    # поэтому размер держит удаление, а не отцепление секций. Каждый час, пакетами.
    retention-sweep-cron: ${DB_RETENTION_SWEEP_CRON:0 20 * * * *}
    read-replica:
      # Пусто — весь трафик идёт на основной узел; задать URL, чтобы включить реплику (DB-06).
      url: ${DB_REPLICA_URL:}
      username: ${DB_REPLICA_USER:${DB_USER:commhub}}
      password: ${DB_REPLICA_PASSWORD:${DB_PASSWORD:commhub}}
    # DB-04: контент сообщений шифруется приложением (AES-256-GCM) перед записью.
    # Ключ — base64 32 байт (`openssl rand -base64 32`), в проме приходит из секрет-хранилища
    # платформы; без него контекст не поднимется — тихого отката на открытый текст нет.
    # Ротация: добавить новый ключ в keys, перевести на него active-key-id, старый держать,
    # пока живы секции со строками, записанными под ним (DB-03).
    encryption:
      enabled: ${CONTENT_ENCRYPTION_ENABLED:true}
      active-key-id: ${CONTENT_ENCRYPTION_KEY_ID:k1}
      keys:
        k1: ${CONTENT_ENCRYPTION_KEY:}

  # Фильтрация и compliance (FR-5.4, SEC-05). Часы тишины сюда не входят: они настраиваются
  # на потоке и на канале в БД и применяются без рестарта (FR-5.3, AD-07).
  compliance:
    frequency-cap:
      max-messages: ${FREQUENCY_CAP_MAX:10}
      window: ${FREQUENCY_CAP_WINDOW:24h}
      # MVP по FR-5.4 — только счётчики и алерты: кап на реальном трафике сначала измеряют,
      # а потом включают, иначе первым, что он отрежет, окажется штатная рассылка.
      blocking: ${FREQUENCY_CAP_BLOCKING:false}
    # SEC-05: PAN в контенте отклоняется. false — режим наблюдения (алерт вместо отказа),
    # но SMS отклоняется всегда: в SMS полный номер карты запрещён без оговорок.
    pan-blocking: ${PAN_BLOCKING:true}
    # Хранение счётчиков частоты: должно покрывать окно капа, больше — не нужно (DB-03).
    counter-retention: ${FREQUENCY_COUNTER_RETENTION:7d}
    # EM-01: потолки вложений. Проверяются на валидации, до маршрутизации: отказ конвейера несёт
    # системе-источнику каноническую причину (IR-01), а отказ релея — SMTP-код, который наверху
    # никто не читает. Размеры — в байтах хранимого файла; base64 добавит на проводе ещё ~треть.
    email:
      max-attachments: ${EMAIL_MAX_ATTACHMENTS:5}
      max-attachment-size: ${EMAIL_MAX_ATTACHMENT_SIZE:10MB}
      max-total-attachment-size: ${EMAIL_MAX_TOTAL_ATTACHMENT_SIZE:20MB}
    # PU-11: 4 КБ — предел самих платформ (APNs и FCM), а не предпочтение. Больший размер лишь
    # переносит отказ из конвейера в APNs — на один вызов на устройство позже.
    # PU-09: сколько устройств адресует одно сообщение. Это граница fan-out'а, а не правило платформы:
    # заявка с двумястами токенами — это рассылка, отправленная через единичный endpoint.
    push:
      max-payload-size: ${PUSH_MAX_PAYLOAD_SIZE:4KB}
      max-tokens-per-message: ${PUSH_MAX_TOKENS:10}

  # Вложения писем (EM-01): в домене хранится только метаданные и ссылка (contentRef), байты лежат
  # здесь. Каталог, а не объектное хранилище: Банк его ещё не выбрал, а заводить зависимость от S3
  # ради нескольких PDF-выписок — не тот порядок действий. Пусто = Hub вложений не носит.
  email:
    attachments:
      directory: ${EMAIL_ATTACHMENTS_DIR:}
      max-bytes: ${EMAIL_ATTACHMENT_MAX_BYTES:26214400}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      # NF-05: три пробы отвечают на три разных вопроса, поэтому составы групп разные.
      # liveness — «жив ли процесс»: рестарт пода из-за недоступной БД меняет аварию на
      # crash loop во время неё. readiness — «можно ли слать сюда трафик»: нужна БД, потому
      # что непринятая транзакция — это непринятое сообщение (AD-03); брокер и провайдеры
      # намеренно снаружи (для того и существует outbox, а провайдер лежит одинаково на всех подах).
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
        startup:
          include: db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      # Общие метки всех метрик инстанса (OBS-01): без них графики двух контуров сливаются.
      application: ${spring.application.name}
      environment: ${COMMHUB_ENVIRONMENT:local}
    distribution:
      # Гистограммы, а не готовые перцентили: p99 OTP по TC-01 считается по всему деплойменту,
      # а посчитанные на инстансе перцентили не складываются.
      percentiles-histogram:
        commhub.pipeline.stage: true
        commhub.provider.calls: true
      slo:
        # SLA OTP: p99 ≤ 5 с от приёма до провайдера (TC-01) — границы вокруг него.
        commhub.pipeline.stage: 100ms,500ms,1s,5s,30s
        commhub.provider.calls: 100ms,500ms,1s,5s,10s
  # OBS-02: трассировка выключена по умолчанию — коллектор есть в контуре Банка, а не локально.
  # Включается COMMHUB_TRACING_SAMPLING (1.0 на тесте, доли процента под нагрузкой NF-01).
  tracing:
    sampling:
      probability: ${COMMHUB_TRACING_SAMPLING:0.0}
    baggage:
      remote-fields: correlationId
      correlation:
        fields: correlationId
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}

logging:
  level:
    root: INFO
    uz.hamkorbank.commhub: DEBUG
  # OBS-03: structured logs. ECS — формат, который читает и ELK, и Loki Банка; консоль остаётся
  # человекочитаемой локально (COMMHUB_LOG_FORMAT пусто) и становится JSON в контуре.
  structured:
    format:
      console: ${COMMHUB_LOG_FORMAT:}
    json:
      # Маскирование PII в отрендеренной строке — страховка под правилом «маскируем в месте записи»
      # (Masking в каркасе провайдеров). Ставится логгером, а не контекстом Spring, поэтому работает
      # с первой строки и переживает несостоявшийся старт.
      customizer: uz.hamkorbank.commhub.adapter.observability.PiiMaskingJsonCustomizer
      context:
        # MDC целиком уезжает в документ: messageId, streamId, batchId, correlationId (OBS-03).
        include: true
