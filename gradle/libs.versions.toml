[versions]
java = "25"
springBoot = "4.1.0"
mapstruct = "1.6.3"
archunit = "1.5.0"
resilience4j = "2.4.0"
spotless = "8.9.0"
checkstyle = "13.9.0"
wiremock = "3.13.1"
greenmail = "2.1.12"

[libraries]
# BOM: версии Spring Boot / Spring Framework / Kafka / Flyway / Testcontainers / JUnit.
# Библиотеки ниже намеренно объявлены без версий — их задаёт BOM.
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }

spring-context = { module = "org.springframework:spring-context" }
spring-tx = { module = "org.springframework:spring-tx" }
# Модулям адаптеров, которым нужен HTTP-клиент/утилиты, но не встроенный сервер (out/provider/*).
spring-web = { module = "org.springframework:spring-web" }
# Jackson 3 (tools.jackson) для модулей с собственными кодеками (contract, persistence, kafka-out,
# провайдеры) — раньше приезжал транзитивно через starter-web единого модуля adapter.
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-jdbc = { module = "org.springframework.boot:spring-boot-starter-data-jdbc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

# MapStruct — обязателен для всех конвертаций DTO <-> command <-> domain (правило проекта)
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }

# Resilience4j — retry/circuit breaker для адаптеров провайдеров (AD-04, PR-01), подключён с Phase 7.
# Берём ядро, а не spring-boot-стартер: реестры создаются явным @Configuration (ProviderResilienceConfig),
# без AOP-аннотаций — так политика провайдера видна в коде и проверяется unit-тестом, а не только yaml'ом.
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry", version.ref = "resilience4j" }

# Email-канал (§9.3, EM-01…EM-03): SMTP-отправка и IMAP-разбор NDR.
# Берём jakarta.mail напрямую, а не spring-boot-starter-mail: из стартера использовался бы только
# JavaMailSender, который открывает соединение на отправку и закрывает его следом, — а EM-01 требует
# пул соединений, MIME-заголовки и подпись DKIM, то есть работу с Transport/MimeMessage как есть.
jakarta-mail-api = { module = "jakarta.mail:jakarta.mail-api" }
angus-mail = { module = "org.eclipse.angus:angus-mail" }

# Наблюдаемость (Phase 13). Micrometer идёт из actuator'а, но адаптер MetricsPort компилируется
# против micrometer-core явно: он живёт в adapter/out/metrics, а не в bootstrap.
micrometer-core = { module = "io.micrometer:micrometer-core" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
# OBS-02: трассировка. Мост Micrometer -> OpenTelemetry и OTLP-экспортёр; сам SDK тянется мостом.
micrometer-tracing = { module = "io.micrometer:micrometer-tracing" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }

# SEC-01/SEC-03: аутентификация систем-источников (OAuth2 client credentials / mTLS) и RBAC.
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }

flyway-core = { module = "org.flywaydb:flyway-core" }
# Автоконфигурация Flyway в Boot 4 вынесена в отдельный модуль: без него spring.flyway.* в yaml
# ничего не включает, и приложение стартует на непромигрированной базе (DB-01).
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

# Тесты
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
# Testcontainers 2.x: артефакты переименованы в testcontainers-<module>
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
# Contract-тесты адаптеров провайдеров по стабам из документации (QA-04, PR-04).
# standalone-артефакт: внутри затенён свой Jetty, поэтому он не конфликтует с Tomcat из Boot.
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
# SMTP/IMAP-сервер в тесте для Email-адаптера и разбора NDR (QA-03, EM-01, EM-02).
greenmail-junit5 = { module = "com.icegreen:greenmail-junit5", version.ref = "greenmail" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
