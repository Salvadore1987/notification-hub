# Настройки локального запуска. В поставку не входят: ни в jar, ни в образ этот файл не попадает
# (каталог config/ не является каталогом ресурсов, а runtime-стадия Dockerfile копирует только jar).
#
# Spring Boot по умолчанию читает ./config/application.yml из РАБОЧЕГО КАТАЛОГА поверх конфигурации
# из classpath. Рабочий каталог локального запуска зависит от того, чем запускают: у Gradle-задачи
# bootRun это каталог модуля bootstrap, у Spring Boot run configuration в IDE — по умолчанию корень
# проекта. Поэтому файлов два: значение задано здесь, а bootstrap/config/application.yml его
# импортирует. Менять нужно только этот.
#
# Что он делает: подставляет ключ шифрования контента (DB-04). Требование «нет ключа — нет старта»
# существует для развёртывания и остаётся в силе — в образе и в K8s этих файлов нет, и запуск jar'а
# из любого каталога вне дерева исходников без настоящего ключа по-прежнему отказывает. Локально же
# отказ старта не сообщал разработчику ничего о том, чем он занят, и стоил одного экспорта
# переменной на каждый терминал и каждую конфигурацию запуска.
#
# Ключ секретом не является: это base64 строки "commhub-local-development-key!!!", и он защищает
# одноразовую базу из docker compose. В контуре Банка ключ приходит из секрет-хранилища платформы.
# Экспортированный CONTENT_ENCRYPTION_KEY побеждает — placeholder ниже читает его первым.
commhub:
  persistence:
    encryption:
      keys:
        k1: ${CONTENT_ENCRYPTION_KEY:Y29tbWh1Yi1sb2NhbC1kZXZlbG9wbWVudC1rZXkhISE=}
