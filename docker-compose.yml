# Локальное окружение разработки Notification Hub.
#   docker compose up -d
# Останов с очисткой данных:  docker compose down -v
name: notification-hub

services:
  postgres:
    image: postgres:16
    container_name: commhub-postgres
    environment:
      POSTGRES_DB: commhub
      POSTGRES_USER: commhub
      POSTGRES_PASSWORD: commhub
      # Локаль/таймзона: хранение в UTC (UI-04)
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commhub -d commhub"]
      interval: 5s
      timeout: 5s
      retries: 20

  # OIDC-издатель локального контура (SEC-02, ADR-0037). Админ-панель закрыта на любом контуре,
  # поэтому издатель нужен и локально: демо-администратор — demo/demo, консоль Keycloak на
  # http://localhost:8180 под admin/admin.
  #
  # KC_HOSTNAME намеренно не задан: start-dev выводит issuer из заголовка Host, поэтому и браузер,
  # и bootRun на хосте, и Testcontainers с проброшенным портом видят согласованный iss.
  # Тома нет намеренно: dev-БД одноразовая, realm импортируется на каждом up — для демо-realm
  # это и есть желаемое поведение (правка docker/keycloak/commhub-realm.json применяется рестартом).
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: commhub-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # Образ ubi-micro: в нём нет ни curl, ни wget. Health живёт на management-порту 9000.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:4.2.1
    container_name: commhub-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: commhub-local-cluster
    ports:
      - "9092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.1
    container_name: commhub-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # NF-08: совместимость схем — BACKWARD
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    ports:
      - "8081:8081"

  # Стабы провайдеров: Playmobile, SMS Gate, FCM, APNs (QA-04, PR-04)
  wiremock:
    image: wiremock/wiremock:3.13.2
    container_name: commhub-wiremock
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "8089:8080"
    volumes:
      - ./docker/wiremock/mappings:/home/wiremock/mappings
      - ./docker/wiremock/__files:/home/wiremock/__files

  # SMTP/IMAP для Email-канала (Phase 11), веб-интерфейс на 8085
  greenmail:
    image: greenmail/standalone:2.1.12
    container_name: commhub-greenmail
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
        -Dgreenmail.verbose
    ports:
      - "3025:3025" # SMTP
      - "3110:3110" # POP3
      - "3143:3143" # IMAP
      - "8085:8080" # REST API / UI

volumes:
  postgres-data:
  kafka-data:
